# Starter product data.
#
# WHAT THIS IS: a small seed of product-to-active-ingredient mappings so the
# tracker is useful before it has talked to DPR, covering the products that
# actually appear in the Lassen County forestry records.
#
# WHAT THIS IS NOT: an authoritative source. Every entry carries a
# `verification` level:
#
#   verified  - the value is corroborated by a cited authoritative source.
#   seed      - a starting value that the DPR/EPA resolver must confirm before
#               anything derived from it is published. Records relying on a
#               `seed` value are routed to review, not published automatically.
#
# `percent` is left null wherever the exact figure is not corroborated. A null
# percentage means pounds-of-active-ingredient totals will report themselves as
# incomplete rather than silently under-count. Fill these from the product
# label or DPR's product database, not from memory.

version: 1

products:
  - epa_reg_no: "62719-259"
    name: TRANSLINE
    registrant: Corteva Agriscience
    formulation: SL
    verification: seed
    source: "EPA registration number as reported on Lassen County use records"
    ingredients:
      - name: Clopyralid
        percent: null

  - epa_reg_no: "2935-50176"
    name: SUPER SPREAD MSO
    registrant: Wilbur-Ellis
    formulation: liquid
    is_adjuvant: true
    verification: seed
    source: "EPA registration number as reported on Lassen County use records"
    # An adjuvant is a spray additive, not a pesticide: it has no pesticidal
    # active ingredient, so it must not be counted in active-ingredient totals.
    ingredients: []

