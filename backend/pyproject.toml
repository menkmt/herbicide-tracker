[project]
name = "ground-truth-tracker"
version = "0.1.0"
description = "California pesticide-use report (PUR) ingestion, enrichment and public tracker backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.15",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "python-slugify>=8.0",
    "redis>=5.0",
    "rq>=1.16",
    "pillow>=10.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic writes these; reformatting machine-generated migrations only creates
# noise in diffs and risks changing a migration that has already been applied.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
