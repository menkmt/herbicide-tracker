# Local and small-deployment stack.
#
# Bring it up with:
#   cp .env.example .env    # then edit
#   docker compose up -d
#   docker compose exec api alembic upgrade head
#
# Then the admin dashboard is at http://localhost:8000/admin and the public
# site at http://localhost:3000.

name: protect-lassen-tracker

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracker}
      POSTGRES_DB: ${POSTGRES_DB:-tracker}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracker}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      TRACKER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD:-tracker}@db:5432/${POSTGRES_DB:-tracker}
      TRACKER_REDIS_URL: redis://redis:6379/0
      TRACKER_ENVIRONMENT: ${TRACKER_ENVIRONMENT:-development}
      TRACKER_SECRET_KEY: ${TRACKER_SECRET_KEY:-dev-only-change-me}
      TRACKER_ADMIN_TOKEN: ${TRACKER_ADMIN_TOKEN:-}
      TRACKER_STORAGE_BACKEND: ${TRACKER_STORAGE_BACKEND:-local}
      TRACKER_STORAGE_LOCAL_PATH: /app/storage
      TRACKER_PUBLIC_BASE_URL: ${TRACKER_PUBLIC_BASE_URL:-http://localhost:3000}
      TRACKER_INQUISITOR_ENABLED: ${TRACKER_INQUISITOR_ENABLED:-false}
      TRACKER_INQUISITOR_BASE_URL: ${TRACKER_INQUISITOR_BASE_URL:-}
      TRACKER_INQUISITOR_WORKSPACE_ID: ${TRACKER_INQUISITOR_WORKSPACE_ID:-}
      TRACKER_INQUISITOR_ACTOR: ${TRACKER_INQUISITOR_ACTOR:-}
    volumes:
      - source-files:/app/storage
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      args:
        TRACKER_API_URL: http://api:8000
    depends_on:
      - api
    environment:
      TRACKER_API_URL: http://api:8000
      NEXT_PUBLIC_SITE_URL: ${TRACKER_PUBLIC_BASE_URL:-http://localhost:3000}
      NEXT_PUBLIC_BASEMAP_TILE_URL: ${BASEMAP_TILE_URL:-}
      NEXT_PUBLIC_BASEMAP_ATTRIBUTION: ${BASEMAP_ATTRIBUTION:-}
    ports:
      - "3000:3000"

  # Monthly CPRA refresh. Runs on the first of each month and otherwise sleeps;
  # the watermark is stored in the database, so a missed run simply catches up.
  cpra-sync:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      TRACKER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD:-tracker}@db:5432/${POSTGRES_DB:-tracker}
      TRACKER_STORAGE_LOCAL_PATH: /app/storage
      TRACKER_INQUISITOR_ENABLED: ${TRACKER_INQUISITOR_ENABLED:-false}
      TRACKER_INQUISITOR_BASE_URL: ${TRACKER_INQUISITOR_BASE_URL:-}
      TRACKER_INQUISITOR_WORKSPACE_ID: ${TRACKER_INQUISITOR_WORKSPACE_ID:-}
      TRACKER_INQUISITOR_ACTOR: ${TRACKER_INQUISITOR_ACTOR:-}
      TRACKER_INQUISITOR_AUTO_SEND: ${TRACKER_INQUISITOR_AUTO_SEND:-false}
    volumes:
      - source-files:/app/storage
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          if [ "$$(date +%d)" = "${TRACKER_INQUISITOR_SYNC_DAY:-01}" ]; then
            python -m app.jobs.run_cpra_sync || echo "CPRA sync failed; will retry next month"
            sleep 86400
          fi
          sleep 3600
        done

volumes:
  db-data:
  redis-data:
  source-files:
