# Local and small-deployment stack.
#
# Bring it up with:
#   cp .env.example .env    # then edit
#   docker compose up -d
#   docker compose exec api alembic upgrade head
#
# Then the admin dashboard is at http://localhost:8000/admin and the public
# site at http://localhost:3000.
#
# Published ports are bound to 127.0.0.1 on purpose. Docker programs iptables
# directly and its rules are consulted before ufw's, so a plain "8000:8000"
# would be reachable from the internet no matter what the firewall says. On a
# server the only thing listening publicly is the caddy service below.
#
# Public deployment: set TRACKER_DOMAIN and COMPOSE_PROFILES=public in .env
# (deploy/enable-domain.sh does this) and Caddy fronts the stack with TLS.

name: ground-truth-tracker

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracker}
      POSTGRES_DB: ${POSTGRES_DB:-tracker}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracker}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      TRACKER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD:-tracker}@db:5432/${POSTGRES_DB:-tracker}
      TRACKER_REDIS_URL: redis://redis:6379/0
      TRACKER_ENVIRONMENT: ${TRACKER_ENVIRONMENT:-development}
      TRACKER_SECRET_KEY: ${TRACKER_SECRET_KEY:-dev-only-change-me}
      TRACKER_ADMIN_TOKEN: ${TRACKER_ADMIN_TOKEN:-}
      TRACKER_STORAGE_BACKEND: ${TRACKER_STORAGE_BACKEND:-local}
      TRACKER_STORAGE_LOCAL_PATH: /app/storage
      TRACKER_PUBLIC_BASE_URL: ${TRACKER_PUBLIC_BASE_URL:-http://localhost:3000}
      TRACKER_INQUISITOR_ENABLED: ${TRACKER_INQUISITOR_ENABLED:-false}
      TRACKER_INQUISITOR_BASE_URL: ${TRACKER_INQUISITOR_BASE_URL:-}
      TRACKER_INQUISITOR_WORKSPACE_ID: ${TRACKER_INQUISITOR_WORKSPACE_ID:-}
      TRACKER_INQUISITOR_ACTOR: ${TRACKER_INQUISITOR_ACTOR:-}
    volumes:
      - source-files:/app/storage
    ports:
      - "127.0.0.1:8000:8000"
    # The port is loopback-only, so the only callers are Caddy and someone on
    # the box itself; trusting forwarded headers from either is safe, and
    # without it the rate limiter would see every visitor as the proxy.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "*"]

  web:
    build:
      context: ./frontend
      args:
        TRACKER_API_URL: http://api:8000
    depends_on:
      - api
    environment:
      TRACKER_API_URL: http://api:8000
      TRACKER_PUBLIC_BASE_URL: ${TRACKER_PUBLIC_BASE_URL:-http://localhost:3000}
      NEXT_PUBLIC_BASEMAP_TILE_URL: ${BASEMAP_TILE_URL:-}
      NEXT_PUBLIC_BASEMAP_ATTRIBUTION: ${BASEMAP_ATTRIBUTION:-}
    ports:
      - "127.0.0.1:3000:3000"

  # Monthly CPRA refresh. Runs on the first of each month and otherwise sleeps;
  # the watermark is stored in the database, so a missed run simply catches up.
  cpra-sync:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      TRACKER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD:-tracker}@db:5432/${POSTGRES_DB:-tracker}
      TRACKER_STORAGE_LOCAL_PATH: /app/storage
      TRACKER_INQUISITOR_ENABLED: ${TRACKER_INQUISITOR_ENABLED:-false}
      TRACKER_INQUISITOR_BASE_URL: ${TRACKER_INQUISITOR_BASE_URL:-}
      TRACKER_INQUISITOR_WORKSPACE_ID: ${TRACKER_INQUISITOR_WORKSPACE_ID:-}
      TRACKER_INQUISITOR_ACTOR: ${TRACKER_INQUISITOR_ACTOR:-}
      TRACKER_INQUISITOR_AUTO_SEND: ${TRACKER_INQUISITOR_AUTO_SEND:-false}
    volumes:
      - source-files:/app/storage
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          if [ "$$(date +%d)" = "${TRACKER_INQUISITOR_SYNC_DAY:-01}" ]; then
            python -m app.jobs.run_cpra_sync || echo "CPRA sync failed; will retry next month"
            sleep 86400
          fi
          sleep 3600
        done

  # Reverse proxy with automatic TLS. Only started under the "public" profile,
  # so local development never touches ports 80/443 or asks Let's Encrypt for
  # anything. Serves the site at TRACKER_DOMAIN and the API and admin
  # dashboard at api.TRACKER_DOMAIN — two hosts rather than path routing
  # because both the API and the Next.js site own an /api/ prefix.
  caddy:
    image: caddy:2-alpine
    profiles: ["public"]
    depends_on:
      - api
      - web
    environment:
      TRACKER_DOMAIN: ${TRACKER_DOMAIN:-}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
      # Browser login for the admin pages (deploy/set-admin-password.sh) and
      # the token Caddy attaches once someone is past it.
      TRACKER_ADMIN_BASIC_HASH: ${TRACKER_ADMIN_BASIC_HASH:-}
      TRACKER_ADMIN_TOKEN: ${TRACKER_ADMIN_TOKEN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

volumes:
  db-data:
  redis-data:
  source-files:
  caddy-data:
  caddy-config:
